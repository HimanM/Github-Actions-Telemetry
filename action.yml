name: 'GitHub Actions Telemetry Observer'
description: 'Centralized telemetry observer for GitHub Actions that monitors and exports execution metrics.'
inputs:
  github_token:
    description: 'GitHub token for API access'
    required: true
  initial_delay:
    description: 'Initial wait time (in seconds) before tracking starts'
    required: false
    default: '60'
  max_timeout:
    description: 'Global timeout (in seconds) before giving up'
    required: false
    default: '3600'
  poll_interval:
    description: 'Seconds to wait between API polls'
    required: false
    default: '15'
  ignored_workflows:
    description: 'Comma separated list of workflow names to ignore (e.g. "Observer,CodeQL")'
    required: false
    default: 'Observer,CodeQL,Dependabot'
  api_url:
    description: 'Optional URL to POST the JSON payload to'
    required: false
  api_key:
    description: 'Optional Auth Bearer token/key for the API Upload'
    required: false
  generate_svg_report:
    description: 'Generate an SVG visual report from the metrics (true or false, default is false)'
    required: false
    default: 'false'
runs:
  using: "composite"
  steps:
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      shell: bash
      run: pip install requests
      
    - name: Run Telemetry Observer
      id: observer
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_SHA: ${{ github.sha }}
        GITHUB_REF_NAME: ${{ github.ref_name }}
        GITHUB_EVENT_NAME: ${{ github.event_name }}
        INITIAL_DELAY: ${{ inputs.initial_delay }}
        MAX_TIMEOUT: ${{ inputs.max_timeout }}
        POLL_INTERVAL: ${{ inputs.poll_interval }}
        IGNORED_WORKFLOWS: ${{ inputs.ignored_workflows }}
        API_URL: ${{ inputs.api_url }}
        API_KEY: ${{ inputs.api_key }}
      run: |
        if [ -n "$API_URL" ]; then echo "::add-mask::$API_URL"; fi
        if [ -n "$API_KEY" ]; then echo "::add-mask::$API_KEY"; fi
        python ${{ github.action_path }}/scripts/observer.py

    - name: Generate SVG Report
      if: ${{ inputs.generate_svg_report == 'true' || inputs.generate_svg_report == 'yes' || inputs.generate_svg_report == '1' }}
      shell: bash
      env:
        JSON_PATH: ${{ steps.observer.outputs.json_path }}
        OUTPUT_SVG: workflow_status.svg
      run: |
        echo "Generating SVG report using generate_svg.py..."
        python ${{ github.action_path }}/scripts/generate_svg.py
